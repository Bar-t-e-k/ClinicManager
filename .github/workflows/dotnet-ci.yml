name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sql-server:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ secrets.DB_PASSWORD }} 
        ports:
          - 1433:1433

    env:
      SeedData__AdminPassword: ${{ secrets.ADMIN_PASSWORD }}
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ClinicManagerDb;User Id=sa;Password=${{ secrets.DB_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ClinicManager.sln

    - name: Build
      run: dotnet build ClinicManager.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test ClinicManager.sln --no-build --verbosity normal --configuration Release

    - name: Build Docker Image
      run: docker build -t clinic-manager:latest -f ./Dockerfile .